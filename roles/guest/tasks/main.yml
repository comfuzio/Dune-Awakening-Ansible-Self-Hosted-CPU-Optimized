---
- name: Wait until the guest accepts Ansible
  ansible.builtin.wait_for_connection:
    timeout: 600

# rc 2 = finished with recoverable warnings, which is normal on Proxmox.
- name: Wait for cloud-init to finish first boot
  ansible.builtin.command: cloud-init status --wait
  register: guest_cloudinit
  changed_when: false
  failed_when: guest_cloudinit.rc not in [0, 2]

- name: Gather facts
  ansible.builtin.setup:

- name: Check the guest is Ubuntu {{ guest_expected_release }}
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version is version(guest_expected_release, '>=')
    fail_msg: "Expected Ubuntu {{ guest_expected_release }}+, found {{ ansible_distribution }} {{ ansible_distribution_version }}."
    quiet: true

- name: Ask the dynamic loader which x86-64 levels the vCPU exposes
  ansible.builtin.command: /lib64/ld-linux-x86-64.so.2 --help
  register: guest_ldso
  changed_when: false

- name: Require x86-64-v3 inside the guest (CPU type must be 'host')
  ansible.builtin.assert:
    that: guest_ldso.stdout is search('x86-64-v3 \(supported')
    fail_msg: The VM does not see x86-64-v3. Set the Proxmox CPU type to 'host'.
    quiet: true

- name: Remove snapd
  when: guest_remove_snapd | bool
  ansible.builtin.apt:
    name: snapd
    state: absent
    purge: true
    autoremove: true

- name: Bring the system fully up to date
  when: guest_full_upgrade | bool
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ guest_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check whether a reboot is pending
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: guest_reboot_flag

- name: Reboot into the updated kernel
  when: guest_reboot_flag.stat.exists
  ansible.builtin.reboot:
    reboot_timeout: 900

- name: Load the BBR congestion control module at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/dune-bbr.conf
    content: "tcp_bbr\n"
    mode: "0644"

- name: Load BBR now
  ansible.builtin.command: modprobe tcp_bbr
  changed_when: false

- name: Apply kernel tuning
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/60-dune.conf
    mode: "0644"
  notify: Load kernel tuning

- name: Enable guest services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - qemu-guest-agent
    - irqbalance

# Funcom's scripts call sudo non-interactively.
- name: Give the dune account passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-dune
    content: "dune ALL=(ALL:ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Create the Funcom working tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: dune
    group: dune
    mode: "0755"
  loop:
    - /home/dune/.dune
    - /home/dune/.dune/download
    - /home/dune/.dune/bin

- name: Put the battlegroup helpers on the dune user's PATH
  ansible.builtin.copy:
    dest: /etc/profile.d/dune.sh
    content: |
      # Managed by Ansible (roles/guest)
      case ":$PATH:" in *":$HOME/.dune/bin:"*) ;; *) PATH="$HOME/.dune/bin:$PATH" ;; esac
    mode: "0644"

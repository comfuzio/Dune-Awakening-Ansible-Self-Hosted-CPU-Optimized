---
- name: Read containerd's effective CRI configuration
  ansible.builtin.command: k3s crictl info
  register: k3s_cri_info
  until: k3s_cri_info.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Fall back to a containerd config template
  when: not ((k3s_cri_info.stdout | from_json).config.disableApparmor | default(false) | bool)
  block:
    - name: Find the containerd config k3s generated
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/agent/etc/containerd/{{ item }}
      loop: [config-v3.toml, config.toml]
      register: k3s_generated

    - name: Read the generated containerd config
      ansible.builtin.slurp:
        src: "{{ (k3s_generated.results | selectattr('stat.exists') | first).stat.path }}"
      register: k3s_generated_cfg

    # k3s renders <config>.tmpl instead of its built-in template when present.
    # This one is the generated config plus disable_apparmor, so it is frozen
    # at this k3s release; re-run this role after a k3s upgrade.
    - name: Write a containerd template with AppArmor disabled
      vars:
        k3s_cri_runtime_hdr: "[plugins.'io.containerd.cri.v1.runtime']\n"
        k3s_apparmor_line: "  disable_apparmor = true\n"
        k3s_tmpl_header: "# Managed by Ansible (roles/k3s): generated config + disable_apparmor.\n"
        k3s_nl: "\n"
        k3s_cfg_lines: "{{ (k3s_generated_cfg.content | b64decode).splitlines() }}"
        # Drop k3s's "generated, do not edit" banner from the copied text.
        k3s_cfg_body: >-
          {{ ((k3s_cfg_lines[1:] if k3s_cfg_lines[0].startswith('# File generated by k3s') else k3s_cfg_lines)
              | join(k3s_nl)) ~ k3s_nl }}
      ansible.builtin.copy:
        dest: "{{ (k3s_generated.results | selectattr('stat.exists') | first).stat.path }}.tmpl"
        mode: "0644"
        content: "{{ k3s_tmpl_header ~ (k3s_cfg_body | replace(k3s_cri_runtime_hdr, k3s_cri_runtime_hdr ~ k3s_apparmor_line)) }}"

    - name: Restart k3s with the template
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted

    - name: Wait for containerd after the restart
      ansible.builtin.command: k3s crictl info
      register: k3s_cri_info_after
      until: k3s_cri_info_after.rc == 0
      retries: 24
      delay: 5
      changed_when: false

    - name: Require AppArmor to be off for containers
      ansible.builtin.assert:
        that: (k3s_cri_info_after.stdout | from_json).config.disableApparmor | default(false) | bool
        fail_msg: >-
          containerd still applies AppArmor to containers. On kernels >= 7.0.0-42
          this breaks postgres and Go services. Check the k3s containerd config.
        quiet: true

    - name: Wait for the node again
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=300s
      changed_when: false

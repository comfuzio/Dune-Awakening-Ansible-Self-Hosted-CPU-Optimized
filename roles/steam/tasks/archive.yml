---
# The archive is kept on the VM so later runs can tell whether it changed;
# the payload is only unpacked again when it did (or when it is missing).
- name: Download the payload archive
  when: dune_payload_archive is match('https?://')
  ansible.builtin.get_url:
    url: "{{ dune_payload_archive }}"
    dest: /home/dune/.dune/payload-archive
    owner: dune
    mode: "0644"
    force: true
  register: steam_archive_dl

- name: Upload the payload archive from the controller
  when: dune_payload_archive is not match('https?://')
  ansible.builtin.copy:
    src: "{{ dune_payload_archive | expanduser }}"
    dest: /home/dune/.dune/payload-archive
    owner: dune
    mode: "0644"
  register: steam_archive_up

- name: Check for an unpacked payload
  ansible.builtin.stat:
    path: "{{ dune_payload_dir }}/scripts/battlegroup.sh"
  register: steam_payload_present

- name: Unpack the payload
  when: >-
    steam_archive_dl is changed or steam_archive_up is changed
    or not steam_payload_present.stat.exists
  block:
    - name: Reset the staging directory
      ansible.builtin.file:
        path: /home/dune/.dune/staging
        state: "{{ item }}"
        owner: dune
        group: dune
        mode: "0755"
      loop: [absent, directory]

    - name: Unpack the archive
      become: true
      become_user: dune
      ansible.builtin.unarchive:
        src: /home/dune/.dune/payload-archive
        dest: /home/dune/.dune/staging
        remote_src: true

    # Archives differ in how many directory levels wrap the payload; the
    # payload root is wherever scripts/battlegroup.sh lives.
    - name: Locate the payload root inside the archive
      ansible.builtin.find:
        paths: /home/dune/.dune/staging
        patterns: battlegroup.sh
        recurse: true
      register: steam_archive_hits

    - name: Fail when the archive is not a Dune payload
      ansible.builtin.assert:
        that: steam_archive_hits.matched > 0
        fail_msg: The archive does not contain scripts/battlegroup.sh.
        quiet: true

    - name: Move the payload into place
      become: true
      become_user: dune
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ (steam_archive_hits.files | map(attribute='path') | sort | first | dirname | dirname) }}/."
          - "{{ dune_payload_dir }}/"
      changed_when: true

    - name: Note that the payload changed
      ansible.builtin.set_fact:
        steam_payload_changed: true

    - name: Clean up staging
      ansible.builtin.file:
        path: /home/dune/.dune/staging
        state: absent
